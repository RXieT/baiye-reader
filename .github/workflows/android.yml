name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Restore Miuix OS4
        id: miuix
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/top/yukonga/miuix
          key: miuix-ea1b935-android-v2
      - name: Compile pinned Miuix
        if: steps.miuix.outputs.cache-hit != 'true'
        run: bash scripts/build-miuix.sh
      - name: Prepare signing
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
        run: |
          if [ -n "$SIGNING_STORE" ]; then
            printf '%s' "$SIGNING_STORE" | base64 -d > "$RUNNER_TEMP/baiye.p12"
            chmod 600 "$RUNNER_TEMP/baiye.p12"
            echo "ANDROID_SIGNING_PATH=$RUNNER_TEMP/baiye.p12" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          WENKU_RELAY_BUILD_KEY: ${{ secrets.WENKU_RELAY_BUILD_KEY }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          mkdir -p delivery
          if [ -n "${ANDROID_SIGNING_PATH:-}" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk delivery/Baiye.apk
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk delivery/Baiye.apk
          fi
          sha256sum delivery/Baiye.apk > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Baiye-Android
          path: delivery/
          if-no-files-found: error
          retention-days: 30
